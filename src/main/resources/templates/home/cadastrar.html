<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinKeeper - Cadastro</title>
    <link rel="stylesheet" th:href="@{/css/style-cadastro&login.css}">
    <link rel="stylesheet" th:href="@{/css/style-header.css}">
    <link rel="stylesheet" th:href="@{/css/variaveis.css}">
    <script th:src="@{/js/cadastrar.js}"></script>
</head>

<body>
    <header>
        <div class="nav">
            <div class="nav-op-active"><a href="">cadastrar</a></div>
            <div class="nav-op"><a th:href="@{/coinkeeper/home}">início</a></div>
            <div class="nav-op"><a th:href="@{/coinkeeper/login}">login</a></div>
        </div>
    </header>
    <main>
        <div class="container">
            <h1 class="h1">Cadastro de Usuário</h1>
            <input class="inpt" id="nome" placeholder="Nome">
            <input class="inpt" id="login" placeholder="Login">
            <input class="inpt" id="email" placeholder="E-mail">
            <input class="inpt" id="senha" type="password" placeholder="Senha">
            <input class="inpt" id="senha-confirm" type="password" placeholder="Confirmar Senha">
            <button class="bttn" onclick="cadastrarUsuario()">Cadastrar</button>
        </div>
        <div class="alert" id="alert-message"></div>
    </main>
</body>

</html>
